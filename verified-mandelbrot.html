<!DOCTYPE html>
<html>
<head>
<title>Verified 128-bit Mandelbrot — Verus-proved Karatsuba GPU</title>
<style>
  body { margin: 0; background: #0a0a0a; display: flex; flex-direction: column;
         align-items: center; justify-content: center; height: 100vh;
         color: #ccc; font-family: monospace; }
  canvas { border: 1px solid #333; cursor: crosshair; }
  #info { margin-top: 10px; font-size: 11px; max-width: 800px; text-align: center; }
  #status { margin-bottom: 8px; font-size: 14px; color: #7f7; }
  h2 { color: #adf; margin-bottom: 4px; }
</style>
</head>
<body>
<h2>Verified 128-bit GPU Mandelbrot</h2>
<div id="status">Loading shader...</div>
<canvas id="canvas" width="400" height="300"></canvas>
<div id="info">
  Shader generated by Verus-proved pipeline: LimbOps (78 verified) + ArithLimb (53 verified) + Karatsuba<br>
  4 limbs × 32 bits = 128-bit fixed-point. Scroll to zoom, click to recenter.
</div>

<script>
const W = 400, H = 300, N = 4; // 4 limbs per value

async function main() {
  const status = document.getElementById('status');
  const canvas = document.getElementById('canvas');

  if (!navigator.gpu) { status.textContent = 'WebGPU not supported'; status.style.color='#f77'; return; }
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) { status.textContent = 'No GPU adapter'; return; }
  const device = await adapter.requestDevice();

  // Load verified shader
  status.textContent = 'Loading verified shader...';
  const shaderResp = await fetch('verified_mandelbrot.wgsl');
  const shaderCode = await shaderResp.text();
  status.textContent = `Compiling shader (${(shaderCode.length/1024).toFixed(0)}KB)...`;
  const module = device.createShaderModule({ code: shaderCode });

  // Buffers
  const paramBuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const cReBuf = device.createBuffer({ size: W*H*N*4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const cImBuf = device.createBuffer({ size: W*H*N*4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const outBuf = device.createBuffer({ size: W*H*4, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_SRC });
  const readBuf = device.createBuffer({ size: W*H*4, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });

  const pipeline = device.createComputePipeline({ layout: 'auto', compute: { module, entryPoint: 'mandelbrot' } });
  const bindGroup = device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: paramBuf } },
      { binding: 1, resource: { buffer: cReBuf } },
      { binding: 2, resource: { buffer: cImBuf } },
      { binding: 3, resource: { buffer: outBuf } },
    ],
  });

  const ctx = canvas.getContext('2d');
  let centerRe = -0.5, centerIm = 0.0, scale = 4.0 / W;
  let maxIter = 64;

  // Convert f64 to N-limb fixed-point (signed, 2 integer limbs + 2 fractional)
  function toFixedPoint(val) {
    // Fixed point: value * 2^64 (frac=64 bits = 2 limbs)
    // Handle sign via two's complement
    const FRAC = 2; // fractional limbs
    const isNeg = val < 0;
    let abs = Math.abs(val);
    const limbs = new Uint32Array(N);
    for (let k = N-1; k >= 0; k--) {
      const shifted = abs * Math.pow(2, 32 * (FRAC - k));
      limbs[k] = shifted >>> 0;
      abs -= (limbs[k] >>> 0) / Math.pow(2, 32 * (FRAC - k));
    }
    if (isNeg) {
      // Two's complement
      let carry = 1;
      for (let k = 0; k < N; k++) {
        const inv = (~limbs[k] >>> 0) + carry;
        limbs[k] = inv >>> 0;
        carry = inv > 0xFFFFFFFF ? 1 : 0;
      }
    }
    return limbs;
  }

  async function render() {
    const t0 = performance.now();

    // Upload params
    const params = new Uint32Array([W, H, maxIter, 0]);
    device.queue.writeBuffer(paramBuf, 0, params);

    // Compute c values for each pixel and upload
    const cReData = new Uint32Array(W * H * N);
    const cImData = new Uint32Array(W * H * N);
    for (let py = 0; py < H; py++) {
      for (let px = 0; px < W; px++) {
        const cr = centerRe + (px - W/2) * scale;
        const ci = centerIm + (py - H/2) * scale;
        const crLimbs = toFixedPoint(cr);
        const ciLimbs = toFixedPoint(ci);
        const idx = (py * W + px) * N;
        for (let k = 0; k < N; k++) {
          cReData[idx + k] = crLimbs[k];
          cImData[idx + k] = ciLimbs[k];
        }
      }
    }
    device.queue.writeBuffer(cReBuf, 0, cReData);
    device.queue.writeBuffer(cImBuf, 0, cImData);

    // Dispatch
    const encoder = device.createCommandEncoder();
    const pass = encoder.beginComputePass();
    pass.setPipeline(pipeline);
    pass.setBindGroup(0, bindGroup);
    pass.dispatchWorkgroups(Math.ceil(W/16), Math.ceil(H/16), 1);
    pass.end();
    encoder.copyBufferToBuffer(outBuf, 0, readBuf, 0, W*H*4);
    device.queue.submit([encoder.finish()]);

    // Read back iteration counts
    await readBuf.mapAsync(GPUMapMode.READ);
    const iterData = new Uint32Array(readBuf.getMappedRange().slice(0));
    readBuf.unmap();

    // Color and display
    const imageData = ctx.createImageData(W, H);
    for (let i = 0; i < W*H; i++) {
      const iter = iterData[i];
      const off = i * 4;
      if (iter >= maxIter) {
        imageData.data[off] = 0; imageData.data[off+1] = 0;
        imageData.data[off+2] = 0; imageData.data[off+3] = 255;
      } else {
        const t = iter / maxIter;
        imageData.data[off]   = Math.floor(t * 255 * (1-t) * 4);
        imageData.data[off+1] = Math.floor(t * t * 255);
        imageData.data[off+2] = Math.floor((1-t)*(1-t) * 255);
        imageData.data[off+3] = 255;
      }
    }
    ctx.putImageData(imageData, 0, 0);

    const dt = performance.now() - t0;
    status.textContent = `128-bit verified | ${dt.toFixed(0)}ms | center: (${centerRe.toFixed(6)}, ${centerIm.toFixed(6)}) | zoom: ${(4/scale/W).toFixed(1)}x`;
  }

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const cre = centerRe + (mx - W/2) * scale;
    const cim = centerIm + (my - H/2) * scale;
    scale *= e.deltaY > 0 ? 1.3 : 1/1.3;
    centerRe = cre - (mx - W/2) * scale;
    centerIm = cim - (my - H/2) * scale;
    render();
  });

  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    centerRe += (e.clientX - rect.left - W/2) * scale;
    centerIm += (e.clientY - rect.top - H/2) * scale;
    render();
  });

  status.textContent = 'Rendering...';
  await render();
}
main().catch(e => { document.getElementById('status').textContent = 'Error: ' + e.message; });
</script>
</body>
</html>
